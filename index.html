<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫번째 아이디어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef5ff 0%, #dbeafe 50%, #bfdbfe 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
    }

    .container {
      text-align: center;
      padding: 3.5rem 5rem;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      border: 1px solid rgba(191, 219, 254, 0.6);
      box-shadow: 
        0 20px 40px rgba(37, 99, 235, 0.12),
        0 1px 3px rgba(37, 99, 235, 0.08);
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      font-weight: 800;
      color: #1d4ed8;
      letter-spacing: -1px;
      text-shadow: 0 4px 16px rgba(29, 78, 216, 0.15);
      line-height: 1.2;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>내 첫번째 아이디어</h1>
  </div>
</body>
</html>
